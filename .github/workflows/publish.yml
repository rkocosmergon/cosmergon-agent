name: Publish to PyPI

on:
  workflow_dispatch:
    # MANUELL — nie auf push:tags ändern ohne explizite Gründer-Freigabe.
    # Hintergrund: push:tags v* hat v0.3.40/0.3.41 ohne Go veröffentlicht (08.04.2026).
    # Der Trusted Publisher auf PyPI ist aktiv — jede Trigger-Änderung publiziert sofort.
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for Trusted Publisher (OIDC)

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      # S329 (#232 K3, Founder-Entscheid 09.09.2026): das Artefakt wird INSTALLIERT,
      # bevor es hochgeladen wird. `twine check` prueft die Metadaten, nicht die
      # Aufloesbarkeit der Pins — genau daran hingen langchain-cosmergon 0.2.0
      # (langchain-core<0.4) und cosmergon-agent<0.16 monatelang uninstallierbar auf
      # PyPI, und der taegliche Waechter (check-public-pakete.py, S328) sah es erst
      # am Tag DANACH. Ein Bare-Install aus dem Wheel loest die Pins so auf, wie ein
      # Nutzer es tut; `pip install -e .` in der CI tut das nicht.
      #
      # Verworfen wurde ein Gate auf die privaten Tests: die liegen im privaten Repo,
      # ein Lese-Token dafuer waere ein Dauer-Secret im oeffentlichen Repo — und die
      # Suite haette die real eingetretene Klasse nicht gefangen. Die Kopplung an den
      # privaten Testlauf bleibt die Reihenfolge (Heft-SDK 7.1), kein Automatismus.
      - name: Artefakt installierbar (bare, ohne Extras)
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet --upgrade pip
          /tmp/probe/bin/pip install "$(ls dist/*.whl)"
          /tmp/probe/bin/python -c "
          import importlib.metadata as md
          import cosmergon_agent as m
          paket = md.version('cosmergon-agent')
          modul_version = getattr(m, '__version__', None)
          if modul_version is None:
              print('OK ' + paket + ' - Modul fuehrt kein __version__, Abgleich entfaellt')
          else:
              assert modul_version == paket, '__init__.py sagt ' + repr(modul_version) + ', das Paket ' + repr(paket) + ' - die beiden Versionsangaben sind auseinandergelaufen'
              print('OK ' + paket + ' - Import und Version decken sich')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No api_token needed — Trusted Publisher via OIDC

      # cos20 #369: the official MCP Registry lists this package. Until 0.20 it was
      # published by hand from a copy of server.json in another repo — the copy
      # stopped at 0.17.0 while PyPI moved on. The listing is now published here,
      # right after PyPI. The version comes from the wheel that was just uploaded
      # (one source, and never the free-text input inside a shell line). Login is
      # GitHub OIDC (id-token: write above), bound to this repository's namespace
      # io.github.rkocosmergon — no secret, no device login.
      - name: Read the published version from the wheel
        id: paket
        run: |
          rad="$(ls dist/*.whl)"
          version="$(basename "$rad" | cut -d- -f2)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait until PyPI serves the new version
        env:
          VERSION: ${{ steps.paket.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/cosmergon-agent/${VERSION}/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not serve ${VERSION} after 5 min" >&2
          exit 1

      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -sfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Write server.json for this version
        env:
          VERSION: ${{ steps.paket.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          server = {
              "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
              "name": "io.github.rkocosmergon/cosmergon",
              "title": "Cosmergon",
              "description": "Living economy for AI agents — Conway physics, energy currency, marketplace, reputation.",
              "repository": {"url": "https://github.com/rkocosmergon/cosmergon-agent", "source": "github"},
              "version": version,
              "websiteUrl": "https://cosmergon.com",
              "packages": [
                  {
                      "registryType": "pypi",
                      "identifier": "cosmergon-agent",
                      "version": version,
                      "transport": {"type": "stdio"},
                  }
              ],
          }
          with open("server.json", "w", encoding="utf-8") as f:
              json.dump(server, f, indent=2, ensure_ascii=False)
          PY

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
